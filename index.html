<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f3ff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Portfolio of Your Name - Full-Stack Developer & Designer" />
    <title>Your Name | Full-Stack Developer & Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700&family=Rowdies:wght@400;700&family=Space+Grotesk:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
